name: Skill Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run unit tests
        run: uv run pytest tests/skills/unit/ -v --tb=short
      - name: Run integration tests
        run: uv run pytest tests/skills/integration/ -v --tb=short
      - name: Run e2e tests (deterministic only)
        run: uv run pytest tests/skills/e2e/ -v --tb=short -k "not llm_judge"
      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reports
          path: tests/skills/reports/junit_*.xml
          if-no-files-found: ignore
