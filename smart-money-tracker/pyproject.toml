[project]
name = "smart-money-tracker"
version = "0.1.0"
description = "Smart Money Tracker - Monitor congress trades, whale holdings, and house reps disclosures"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "requests>=2.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_money_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.uv]
default-groups = ["main"]

[dependency-groups]
main = ["requests>=2.28.0", "pytest"]
cloudscraper = ["cloudscraper>=1.2.71"]

[coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "except:",
    "except Exception:",
    "pass",
]
